<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>HASHIRA — Create Account</title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="register.css"
    >

</head>


<body>

<main class="register-page">


    <!-- =========================================
         IMAGE SIDE
    ========================================== -->

    <section class="fashion-side">

        <div class="fashion-image"></div>

        <div class="fashion-overlay"></div>


        <div class="fashion-content">

            <div class="brand-mark">
                HASHIRA
            </div>


            <div class="fashion-copy">

                <p>
                    YOUR STYLE. YOUR STORY.
                </p>

                <h2>
                    Make it<br>
                    yours.
                </h2>

                <span>
                    Create your HASHIRA account and
                    discover styles designed around you.
                </span>

            </div>

        </div>

    </section>


    <!-- =========================================
         REGISTER SIDE
    ========================================== -->

    <section class="register-side">

        <div class="register-container">


            <!-- MOBILE LOGO -->

            <a
                href="index.html"
                class="mobile-logo"
            >
                HASHIRA
            </a>


            <!-- HEADING -->

            <div class="register-heading">

                <p class="eyebrow">
                    JOIN HASHIRA
                </p>

                <h1>
                    Create account
                </h1>

                <p class="subtitle">
                    Join us and make every look your own.
                </p>

            </div>


            <!-- FORM -->

            <form
                id="registerForm"
                class="register-form"
            >


                <!-- NAME -->

                <div class="form-group">

                    <label for="name">
                        FULL NAME
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        EMAIL ADDRESS
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        PASSWORD
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Create a password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                        >
                            SHOW
                        </button>

                    </div>

                    <div class="password-strength">

                        <span
                            id="strengthBar"
                        ></span>

                    </div>

                    <p
                        id="passwordHint"
                        class="password-hint"
                    >
                        Use at least 6 characters.
                    </p>

                </div>


                <!-- CONFIRM PASSWORD -->

                <div class="form-group">

                    <label for="confirmPassword">
                        CONFIRM PASSWORD
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            autocomplete="new-password"
                            required
                        >

                        <button
                            type="button"
                            id="toggleConfirmPassword"
                            class="password-toggle"
                        >
                            SHOW
                        </button>

                    </div>

                </div>


                <!-- MESSAGE -->

                <div
                    id="registerMessage"
                    class="register-message"
                ></div>


                <!-- TERMS -->

                <label class="terms-label">

                    <input
                        type="checkbox"
                        id="terms"
                        required
                    >

                    <span>
                        I agree to the
                        <a href="#">
                            Terms
                        </a>
                        and
                        <a href="#">
                            Privacy Policy
                        </a>.
                    </span>

                </label>


                <!-- CREATE ACCOUNT -->

                <button
                    type="submit"
                    id="registerButton"
                    class="register-button"
                >

                    <span>
                        CREATE ACCOUNT
                    </span>

                    <span class="button-arrow">
                        →
                    </span>

                </button>

            </form>


            <!-- LOGIN -->

            <div class="login-link">

                <span>
                    Already have an account?
                </span>

                <a href="login.html">
                    Sign in
                </a>

            </div>


            <!-- FOOTER -->

            <div class="register-footer">

                <p>
                    © 2026 HASHIRA. All rights reserved.
                </p>

            </div>


        </div>

    </section>

</main>


<script src="register.js"></script>

</body>

</html>
