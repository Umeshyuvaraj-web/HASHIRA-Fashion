<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        HASHIRA — Order Confirmed
    </title>

    <link
        rel="stylesheet"
        href="order-success.css"
    >

</head>


<body>

    <header class="success-header">

        <a
            href="index.html"
            class="brand"
        >
            HASHIRA
        </a>

    </header>


    <main class="success-page">

        <section class="success-card">

            <div class="success-icon">
                ✓
            </div>


            <p class="eyebrow">
                HASHIRA STORE
            </p>


            <h1>
                ORDER CONFIRMED
            </h1>


            <p class="success-message">
                Thank you for your order.
                Your order has been successfully placed.
            </p>


            <div class="order-number-box">

                <span>
                    ORDER NUMBER
                </span>

                <strong id="orderNumber">
                    —
                </strong>

            </div>


            <div class="success-actions">

                <a
                    href="orders.html"
                    class="primary-button"
                >
                    VIEW MY ORDERS
                </a>


                <a
                    href="index.html"
                    class="secondary-button"
                >
                    CONTINUE SHOPPING
                </a>

            </div>

        </section>

    </main>


    <script
        src="order-success.js"
    ></script>

</body>

</html>
